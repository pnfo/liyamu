plugins {
    id 'com.android.application'
}

// The engine is the Rust static library, built for each ABI by ../build-rust.sh before Gradle runs.
android {
    namespace 'lk.arutha.liyamu'
    compileSdk 36
    ndkVersion '27.1.12297006'
    defaultConfig {
        applicationId 'lk.arutha.liyamu'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.5.0'
        ndk {
            // ABIS=... ./build-rust.sh builds more; the emulator on an Apple Silicon Mac needs only arm64
            abiFilters(*(findProperty('abis') ?: 'arm64-v8a').split(','))
        }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=none' }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // The Play upload key: its place and passwords are in ~/.gradle/gradle.properties, never in the repo.
    signingConfigs {
        release {
            storeFile file(findProperty('LIYAMU_STORE_FILE') ?: '/Volumes/2TB/Android/pitaka.lk.jks')
            keyAlias findProperty('TIPITAKA_KEY_ALIAS') ?: ''
            storePassword findProperty('TIPITAKA_STORE_PASSWORD') ?: ''
            keyPassword findProperty('TIPITAKA_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            if (findProperty('TIPITAKA_STORE_PASSWORD')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
