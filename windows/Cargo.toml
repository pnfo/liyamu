[package]
name = "liyamu-windows"
description = "Liyamu for Windows: the TSF text service (DLL) and the settings program"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "liyamu_ime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "liyamu-settings"
path = "src/bin/settings.rs"

[dependencies]
liyamu-core = { path = "../core/liyamu-core" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2"
